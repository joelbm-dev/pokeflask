<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pokédex</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../static/styles.css" />
  </head>
  <body class="bg-light">
    <div class="container my-5">
      <h1 class="text-center mb-5 fw-bold">Pokédex</h1>
      <div class="row row-cols-1 row-cols-md-3 g-4">
        {% for pokemon in pokemon_list %}
        <div class="col">
          <div class="card h-100 text-center shadow-sm border-0">
            <div class="p-3 bg-dark-subtle rounded-top">
              <img
                src="{{ pokemon.sprites.front_default }}"
                class="card-img-top w-50"
                alt="{{ pokemon.name }}"
              />
            </div>
            <div class="card-body">
              <h2 class="card-title h4 text-capitalize fw-bold">
                {{ pokemon.name }}
              </h2>

              <hr />

              <div class="d-flex justify-content-around text-muted">
                <div>
                  <span class="d-block fw-bold text-dark"
                    ><small>Nº </small>{{ pokemon.id }}</span
                  >
                </div>

                <hr />
                {% for type in pokemon.types %}
                <div class="bg-{{ type.type.name }} rounded px-2 border">
                  {{ type.type.name }}
                </div>
                {% endfor %}
              </div>
            </div>
          </div>
        </div>
        {% endfor %}
      </div>
    </div>
  </body>
</html>
