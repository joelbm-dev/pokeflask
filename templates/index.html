<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pokédex</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../static/styles.css" />
  </head>
  <body class="bg-light">
    <div class="container my-5">
      <h1 class="text-center mb-5 pokedex-title">Pokédex</h1>
      <div class="row row-cols-1 row-cols-md-3 g-4">
        {% for pokemon in pokemon_list %}
        <div class="col">
          <div class="card h-100 text-center shadow border-dark border-2 rounded-4 overflow-hidden">
            
            <div class="pt-5 pb-5 bg-danger border-bottom border-dark border-5 position-relative">
              <div class="position-absolute top-100 start-50 translate-middle bg-white rounded-circle shadow border border-dark border-5 overflow-hidden d-flex align-items-center justify-content-center pokeball-btn">
                <img
                  src="{{ pokemon.sprites.front_default }}"
                  class="object-fit-contain pokeball-sprite"
                  alt="{{ pokemon.name }}"
                />
              </div>
            </div>

            <div class="card-body bg-white pt-5 mt-4">
              <h2 class="card-title h4 text-capitalize fw-bold mt-2 mb-3">
                {{ pokemon.name }}
              </h2>
              
              <hr class="border-dark opacity-25 my-3" />
              
              <div class="d-flex justify-content-around align-items-center text-muted">
                <div>
                  <span class="d-block fw-bold text-dark">
                    <small>Nº </small>{{ pokemon.id }}
                  </span>
                </div>
                
                <div class="d-flex gap-1">
                  {% for type in pokemon.types %}
                  <div class="bg-{{ type.type.name }} rounded px-2 py-1 text-white fw-bold small text-uppercase border">
                    {{ type.type.name }}
                  </div>
                  {% endfor %}
                </div>
              </div>
            </div>

          </div>
        </div>
        {% endfor %}
      </div>
    </div>
  </body>
</html>
